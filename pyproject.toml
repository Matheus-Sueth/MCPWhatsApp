[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sueth-mcp-whatsapp"
version = "0.1.0"
description = "MCP remoto para WhatsApp Business Cloud API (Meta)"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.3.0,<3",
  "httpx>=0.27,<1",
  "PyJWT[crypto]>=2.10,<3",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
